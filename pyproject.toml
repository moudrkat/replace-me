[project]
name = "replace-me-at-work"
version = "0.1.0"
description = "A local avatar that sits in your meetings so that, sooner or later, it can replace you at work"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Kateřina Fajmanová" }]
dependencies = [
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "faster-whisper>=1.0",
    "edge-tts>=7.0",
    "mcp>=1.6",
]

[project.urls]
Homepage = "https://github.com/moudrkat/replace-me"

[project.scripts]
replace-me = "replace_me.__main__:run"
replace-me-brain = "replace_me.brain:main"
replace-me-mcp = "replace_me.mcp:main"
replace-me-style = "replace_me.style:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replace_me"]
